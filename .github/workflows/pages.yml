name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter os arquivos
        uses: actions/checkout@v6

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Preparar o site estático
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          cp -R css dados imagens js _site/

      - name: Enviar os arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
