<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reciclando — protótipo básico</title>
  <link rel="icon" href="imagens/icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/jogo.css">
  <script defer src="js/base.js"></script>
  <script defer src="dados/config.js"></script>
  <script defer src="dados/lixeiras.js"></script>
  <script defer src="dados/itens.js"></script>
  <script defer src="dados/fases/fase1-casa.js"></script>
  <script defer src="js/regras/sorteio.js"></script>
  <script defer src="js/regras/partida.js"></script>
  <script defer src="js/jogo/tela-jogo.js"></script>
  <script defer src="js/principal.js"></script>
</head>
<body>
  <main>
    <header><h1>Reciclando — Casa</h1><button id="reiniciar" type="button">Reiniciar</button></header>
    <p>Clique na lixeira certa para o item destacado, mais perto do fim da esteira.</p>
    <section aria-label="Esteira de resíduos">
      <p class="sentido" aria-hidden="true">Entrada → Fim</p>
      <div id="esteira"><div id="pista"></div></div>
      <p id="item-atual" aria-live="polite"></p>
    </section>
    <p id="retorno" role="status">Observe o material e o estado de cada item.</p>
    <div id="lixeiras" aria-label="Lixeiras"></div>
    <p id="andamento"></p>
    <noscript>Ative o JavaScript para executar o jogo.</noscript>
  </main>
</body>
</html>
